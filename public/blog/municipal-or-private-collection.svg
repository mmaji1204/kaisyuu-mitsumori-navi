<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f6ef"/><g font-family="sans-serif" fill="#215c44"><text x="60" y="85" font-size="24" font-weight="700" letter-spacing="4">不用品回収ナビ / 処分方法の比較</text><text x="60" y="175" font-size="53" font-weight="700">自分に合う、片付け方を。</text></g><rect x="60" y="225" width="515" height="340" rx="18" fill="white" stroke="#cadbc7" stroke-width="3"/><rect x="625" y="225" width="515" height="340" rx="18" fill="#215c44"/><g font-family="sans-serif" text-anchor="middle"><text x="317" y="304" fill="#215c44" font-size="35" font-weight="700">自治体の粗大ごみ</text><text x="882" y="304" fill="white" font-size="35" font-weight="700">民間業者へ相談</text><text x="317" y="495" fill="#60745e" font-size="24">品目・手数料・排出場所を確認</text><text x="882" y="495" fill="#e0ecdb" font-size="24">搬出・日程・総額を確認</text></g><g stroke-width="7" stroke-linejoin="round" fill="none"><g stroke="#215c44"><path d="m262 368 55-32 55 32m-108 6h107m-99 0v65m30-65v65m30-65v65m30-65v65m-110 3h130"/></g><g stroke="white"><path d="M816 349h98v87h-98zm98 26h42l26 36v25h-68m0-25h68"/><circle cx="841" cy="443" r="15" fill="#215c44"/><circle cx="951" cy="443" r="15" fill="#215c44"/></g></g><g font-family="sans-serif" fill="#a94b1d" font-size="25" text-anchor="middle" font-weight="700"><text x="600" y="621">価格だけでなく、できる作業と期限を比べましょう。</text></g></svg>
