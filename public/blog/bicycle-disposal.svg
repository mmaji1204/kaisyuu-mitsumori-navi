<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">自転車、どう捨てる？</title>
  <desc id="desc">自転車と登録カード、バッテリー。登録・電池・搬出を確認する案内。</desc>
  <rect width="1200" height="675" fill="#efe4d6"/>
  <rect x="42" y="42" width="1116" height="591" rx="26" fill="#fffdf7"/>
  <g font-family="sans-serif" fill="#173f38">
    <text x="82" y="105" font-size="24" font-weight="700" letter-spacing="2">不用品回収ナビ / 自転車の処分</text>
    <text x="82" y="224" font-size="65" font-weight="700">自転車、</text>
    <text x="82" y="312" font-size="65" font-weight="700">どう捨てる？</text>
    <rect x="82" y="356" width="480" height="66" rx="10" fill="#173f38"/>
    <text x="322" y="400" text-anchor="middle" fill="white" font-size="28" font-weight="700">登録・電池・搬出を確認</text>
    <text x="82" y="494" font-size="30" font-weight="700">手放す前に、登録を確認。</text>
    <text x="82" y="541" font-size="25">電動タイプは電池の出し方も。</text>
  </g>
