<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">こたつ、どう捨てる？</title>
  <desc id="desc">天板と本体を分けたこたつ、畳んだ布団。部品・料金・搬出を確認する案内。</desc>
  <rect width="1200" height="675" fill="#efe4d6"/>
  <rect x="42" y="42" width="1116" height="591" rx="26" fill="#fffdf7"/>
  <g font-family="sans-serif" fill="#173f38">
    <text x="82" y="105" font-size="24" font-weight="700" letter-spacing="2">不用品回収ナビ / 暖房器具の処分</text>
    <text x="82" y="224" font-size="65" font-weight="700">こたつ、</text>
    <text x="82" y="312" font-size="65" font-weight="700">どう捨てる？</text>
    <rect x="82" y="356" width="480" height="66" rx="10" fill="#173f38"/>
    <text x="322" y="400" text-anchor="middle" fill="white" font-size="28" font-weight="700">部品・料金・搬出を確認</text>
    <text x="82" y="494" font-size="30" font-weight="700">本体・天板・布団を整理。</text>
    <text x="82" y="541" font-size="25">解体する前に、出し方を確認。</text>
  </g>
  <circle cx="873" cy="347" r="208" fill="#e5efdf"/>
