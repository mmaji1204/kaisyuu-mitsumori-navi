<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">炊飯器、どう捨てる？</title>
  <desc id="desc">炊飯器と取り外した内釜。内釜・電池・回収先を確認する案内。</desc>
  <rect width="1200" height="675" fill="#efe4d6"/>
  <rect x="42" y="42" width="1116" height="591" rx="26" fill="#fffdf7"/>
  <g font-family="sans-serif" fill="#173f38">
    <text x="82" y="105" font-size="24" font-weight="700" letter-spacing="2">不用品回収ナビ / 家電の処分</text>
    <text x="82" y="224" font-size="65" font-weight="700">炊飯器、</text>
    <text x="82" y="312" font-size="65" font-weight="700">どう捨てる？</text>
    <rect x="82" y="356" width="480" height="66" rx="10" fill="#173f38"/>
    <text x="322" y="400" text-anchor="middle" fill="white" font-size="28" font-weight="700">内釜・電池・回収先</text>
    <text x="82" y="494" font-size="30" font-weight="700">本体も、内釜も。</text>
    <text x="82" y="541" font-size="25">手放す前に、出し方を確認。</text>
  </g>
