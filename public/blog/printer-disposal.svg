    <text x="82" y="105" font-size="24" font-weight="700" letter-spacing="2">不用品回収ナビ / 家電の処分</text>
    <text x="82" y="224" font-size="65" font-weight="700">プリンター、</text>
    <text x="82" y="312" font-size="65" font-weight="700">どう捨てる？</text>
    <rect x="82" y="356" width="480" height="66" rx="10" fill="#173f38"/>
    <text x="322" y="400" text-anchor="middle" fill="white" font-size="28" font-weight="700">回収先・インク・初期化</text>
    <text x="82" y="494" font-size="30" font-weight="700">本体も、残った設定も。</text>
    <text x="82" y="541" font-size="25">手放す前の準備を、ひとつずつ。</text>
  </g>
