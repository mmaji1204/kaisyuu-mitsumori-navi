    <text x="82" y="105" font-size="24" font-weight="700" letter-spacing="2">不用品回収ナビ / 家電の処分</text>
    <text x="82" y="224" font-size="65" font-weight="700">食洗機、</text>
    <text x="82" y="312" font-size="65" font-weight="700">どう捨てる？</text>
    <rect x="82" y="356" width="480" height="66" rx="10" fill="#173f38"/>
    <text x="322" y="400" text-anchor="middle" fill="white" font-size="28" font-weight="700">水抜き・取り外し・回収先</text>
    <text x="82" y="494" font-size="30" font-weight="700">設置タイプから、確認。</text>
    <text x="82" y="541" font-size="25">工事と回収の範囲をそろえよう。</text>
  </g>
