    <text x="82" y="224" font-size="65" font-weight="700">空気清浄機、</text>
    <text x="82" y="312" font-size="65" font-weight="700">どう捨てる？</text>
    <rect x="82" y="356" width="480" height="66" rx="10" fill="#173f38"/>
    <text x="322" y="400" text-anchor="middle" fill="white" font-size="28" font-weight="700">水抜き・分別・回収先を確認</text>
    <text x="82" y="494" font-size="30" font-weight="700">加湿タイプも、準備から。</text>
    <text x="82" y="541" font-size="25">タンクだけでなくトレーも確認。</text>
